<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MY TVET Dashboard</title>
  <style>
    /* ── CSS Variables ── */
    :root {
      --blue-dark:   #1a3a6b;
      --blue-mid:    #2563a8;
      --blue-light:  #dbeafe;
      --white:       #ffffff;
      --bg:          #f0f4f9;
      --border:      #c5d6ed;
      --text:        #1f2328;
      --muted:       #57606a;
      --green:       #16a34a;
      --amber:       #d97706;
      --red:         #dc2626;
      --radius:      8px;
      --shadow:      0 2px 8px rgba(26,58,107,0.10);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
    }

    /* ── Header ── */
    header {
      background: var(--blue-dark);
      color: var(--white);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    }
    header .logo {
      width: 38px; height: 38px;
      background: var(--blue-mid);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: var(--white);
      flex-shrink: 0;
    }
    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    header .subtitle {
      font-size: 12px;
      color: #a8c4e8;
      margin-top: 1px;
    }

    /* ── Main container ── */
    main {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 24px;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* ── Card grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }
    @media (max-width: 720px) {
      .card-grid { grid-template-columns: 1fr; }
    }

    /* ── Card base ── */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border-top: 4px solid var(--blue-mid);
      padding: 22px 24px 20px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--blue-mid);
      margin-bottom: 14px;
    }

    /* ── Card stat rows ── */
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #f0f4f9;
      font-size: 14px;
    }
    .stat-row:last-of-type { border-bottom: none; }
    .stat-label { color: var(--muted); }
    .stat-value { font-weight: 600; color: var(--text); }

    /* ── Progress bar ── */
    .progress-wrap {
      margin-top: 14px;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .progress-track {
      height: 10px;
      background: var(--blue-light);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--blue-mid);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    /* ── Badge ── */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-green  { background: #dcfce7; color: var(--green); }
    .badge-amber  { background: #fef3c7; color: var(--amber); }
    .badge-red    { background: #fee2e2; color: var(--red);   }

    /* ── Status rows (Workshop card) ── */
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #f0f4f9;
      font-size: 14px;
    }
    .status-row:last-of-type { border-bottom: none; }
    .status-label { color: var(--muted); }
    .status-value { font-weight: 600; }
    .status-ok   { color: var(--green); }
    .status-warn { color: var(--amber); }

    .big-number {
      font-size: 42px;
      font-weight: 700;
      color: var(--blue-dark);
      line-height: 1;
      margin-bottom: 4px;
    }
    .big-sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* ── Checklist panel ── */
    .checklist-panel {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border-top: 4px solid var(--blue-dark);
      padding: 22px 24px 24px;
    }
    .checklist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .checklist-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--blue-dark);
    }
    .checklist-counter {
      font-size: 13px;
      font-weight: 600;
      color: var(--blue-mid);
      background: var(--blue-light);
      padding: 3px 12px;
      border-radius: 99px;
    }
    .checklist-items { list-style: none; }
    .checklist-items li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid #f0f4f9;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .checklist-items li:last-child { border-bottom: none; }
    .checklist-items li input[type="checkbox"] {
      width: 17px; height: 17px;
      accent-color: var(--blue-mid);
      cursor: pointer;
      flex-shrink: 0;
    }
    .checklist-items li.done {
      text-decoration: line-through;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">T</div>
    <div>
      <h1>MY TVET Dashboard</h1>
      <div class="subtitle">Student Workshop Management</div>
    </div>
  </header>

  <main>
    <div class="section-label">Summary Overview</div>
    <div class="card-grid" id="card-grid">
      <!-- Cards injected by Sub-Tasks 2, 3, 4 -->
    </div>

    <!-- Checklist injected by Sub-Task 5 -->
  </main>

</body>
</html>
